account:
  currency: USD
  initial_balance: 1000
  leverage: 100

timeframe: M15

symbols:
  EURUSD:
    pip_size: 0.0001
    point: 0.00001
    digits: 5
    contract_size: 100000
    volume_min: 0.01
    volume_max: 100
    volume_step: 0.01
    default_spread_points: 10
    max_spread_points: 30
    slippage_points: 2
    commission_per_lot: 7.0
  XAUUSD:
    pip_size: 0.1
    point: 0.01
    digits: 2
    contract_size: 100
    volume_min: 0.01
    volume_max: 50
    volume_step: 0.01
    default_spread_points: 25
    max_spread_points: 60
    slippage_points: 5
    commission_per_lot: 7.0

risk:
  risk_per_trade_pct: 1.0
  daily_loss_limit_pct: 3.0
  max_open_positions: 2
  max_consecutive_errors: 5
  stop_file: STOP
  trailing_stop_r: 0.0   # e.g. 1.0 = trail SL one initial-SL-distance behind price; 0 = off

strategy:
  name: ema_atr
  params: {fast: 20, slow: 50, atr_period: 14, atr_mult: 1.5, rr: 2.0}
  # TradingAgents-style daily bias + H1 pullback (docs/tradingagents-strategy.md); needs timeframe: H1.
  # name: pullback_h1
  # params: {ema_fast: 20, ema_slow: 50, atr_period: 14, sl_atr: 1.5, max_sl_atr: 2.5, swing_bars: 10,
  #          rr: 2.0, time_stop_bars: 120, news_blackout_minutes: 30, llm_bias_enabled: false}

paper:
  data_dir: data/live   # CSV folder polled for new closed bars ({SYMBOL}_{TF}.csv)
  db: data/paper.db
  poll_seconds: 10

live:
  live_enabled: false   # live needs this true AND the --confirm-live flag; test on a DEMO account first
  gateway_url: http://127.0.0.1:8765   # gateway/mt5_gateway.py (SSH tunnel to the Windows VPS); token: env MT5_GATEWAY_TOKEN
  magic: 20261108
  deviation_points: 20
  timeout_seconds: 10
  history_bars: 500
  db: data/live.db
  poll_seconds: 10

reports:
  dir: reports
